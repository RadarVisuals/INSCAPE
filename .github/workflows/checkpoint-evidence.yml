name: Read checkpoint browser evidence
on:
  push:
    branches: [codex/verify-studio-20261125]
    paths: [.github/workflows/checkpoint-evidence.yml]
permissions:
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: 45576304885
          github-token: ${{ github.token }}
          pattern: verification-browser-*-1
          path: reports
      - name: Read failing TAP cases from the checkpoint
        shell: python
        run: |
          import json, pathlib, re
          for summary in sorted(pathlib.Path('reports').glob('*/browser/results.json')):
              for result in json.loads(summary.read_text()):
                  if result['status'] == 'passed':
                      continue
                  name = result['name']
                  print(summary.parent.parent.name, name, result['status'])
                  lines = (summary.parent / (name + '.log')).read_text().splitlines()
                  for i, line in enumerate(lines):
                      if re.match(r'^\s*not ok\b', line):
                          print('\n'.join(lines[i:i + 55])[:8000])
                  print('\n'.join(lines[-10:])[:2000])
