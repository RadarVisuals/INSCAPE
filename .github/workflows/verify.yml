name: Verify Inscape

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the exact lockfile
        run: npm ci --no-audit --no-fund
      - name: Install the locked Playwright Chromium and Linux dependencies
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify source and build
        run: npm run verify
        env:
          INSCAPE_VERIFY_REPORT: .verification/ci
      - name: Retain verification evidence even after failure
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          path: .verification/ci
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Retain the verified build
        if: success()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
